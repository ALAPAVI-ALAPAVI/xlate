<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xlate — pixel translator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root{--ink:#2a2236;--paper:#fffaf0;--mint:#d8f3df;--sun:#fde9b8;--pink:#f7c9d8;--sky:#cfe6f7;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fbf7ee;color:var(--ink);font:19px/1.35 "Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#mos{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
#w{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sky);border-bottom:4px solid var(--ink)}
.dots i{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);margin-right:5px;background:var(--pink)}.dots i:nth-child(2){background:var(--sun)}.dots i:nth-child(3){background:var(--mint)}
h1{font:12px "Press Start 2P",monospace;margin:0;flex:1}
.opts{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--sun);border-bottom:4px solid var(--ink);flex-wrap:wrap}
.opts label{display:flex;flex-direction:column;font-size:14px;gap:2px;flex:1;min-width:130px}
select,button,textarea{font:inherit;color:var(--ink)}
select{background:#fff;border:3px solid var(--ink);padding:6px 8px;border-radius:0;font-size:18px;width:100%}
button{background:var(--mint);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 14px;cursor:pointer;border-radius:0;font-weight:600}
button:active{transform:translate(3px,3px);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
#sw{background:var(--pink);align-self:flex-end;font-size:20px;padding:5px 12px}
#out{flex:1;overflow-y:auto;padding:14px}
.m{margin:0 0 14px;max-width:92%}
.m small{display:block;font-size:14px;margin-bottom:3px;opacity:.75}
.m div{white-space:pre-wrap;word-break:break-word;border:3px solid var(--ink);padding:8px 12px;box-shadow:4px 4px 0 var(--ink)}
.u{margin-left:auto}.u div{background:var(--sun)}
.a div{background:var(--mint);font-size:23px;font-weight:600}
.s div{background:#fff;box-shadow:none;border-style:dashed}
.e div{background:var(--pink)}
form{display:flex;gap:10px;padding:10px 12px;background:var(--pink);border-top:4px solid var(--ink);align-items:stretch}
#in{flex:1;background:#fff;border:3px solid var(--ink);padding:8px 10px;resize:none;outline:0;max-height:32vh;font-size:20px;border-radius:0}
#go{font-size:18px}
footer{font-size:14px;padding:6px 12px 8px;border-top:4px solid var(--ink);background:var(--paper)}
</style>
</head>
<body>
<canvas id="mos"></canvas>
<div id="w">
<div class="bar"><span class="dots"><i></i><i></i><i></i></span><h1>XLATE</h1></div>
<div class="opts">
<label>From<select id="from"></select></label>
<button id="sw" type="button" title="Swap languages">⇄</button>
<label>To<select id="to"></select></label>
</div>
<div id="out"></div>
<form id="f"><textarea id="in" rows="2" autofocus placeholder="Type or paste text to translate…"></textarea><button id="go">TRANSLATE</button></form>
<footer>Machine translation (free engine). Not certified; for legal, medical or official documents use a certified human translator.</footer>
</div>
<script>
var L=[['en','English'],['es','Spanish'],['fr','French'],['de','German'],['it','Italian'],['pt','Portuguese'],['nl','Dutch'],['ru','Russian'],['zh-CN','Chinese'],['ja','Japanese'],['ko','Korean'],['ar','Arabic'],['hi','Hindi'],['tr','Turkish'],['pl','Polish'],['sv','Swedish'],['el','Greek'],['he','Hebrew'],['vi','Vietnamese'],['th','Thai'],['id','Indonesian'],['uk','Ukrainian'],['cs','Czech'],['ro','Romanian'],['hu','Hungarian'],['fi','Finnish'],['da','Danish'],['no','Norwegian'],['ca','Catalan'],['tl','Tagalog']];
var out=document.getElementById('out'),inp=document.getElementById('in'),fr=document.getElementById('from'),to=document.getElementById('to'),sw=document.getElementById('sw'),go=document.getElementById('go'),busy=false;
function opt(s,c,n){var o=document.createElement('option');o.value=c;o.textContent=n;s.appendChild(o)}
opt(fr,'auto','Detect language');L.forEach(function(l){opt(fr,l[0],l[1]);opt(to,l[0],l[1])});to.value='en';
function nm(c){return c==='auto'?'Detected':(L.filter(function(l){return l[0]===c})[0]||[0,c])[1]}
function msg(cls,label,text){var m=document.createElement('div');m.className='m '+cls;var s=document.createElement('small');s.textContent=label;var d=document.createElement('div');d.textContent=text;m.appendChild(s);m.appendChild(d);out.appendChild(m);out.scrollTop=out.scrollHeight;return m}
function sync(){sw.disabled=fr.value==='auto'}fr.onchange=sync;sync();
sw.onclick=function(){if(fr.value==='auto')return;var t=fr.value;fr.value=to.value;to.value=t;sync()};
async function run(){
 var t=inp.value.trim();if(!t||busy)return;busy=true;go.disabled=true;inp.value='';
 msg('u','you · '+nm(fr.value)+' → '+nm(to.value),t);
 var m=msg('a','xlate','translating…'),d=m.lastChild;
 try{
  var r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,from:fr.value,to:to.value})});
  var j=await r.json();
  if(!r.ok){m.className='m e';d.textContent=j.error||'translation failed'}
  else{d.textContent=j.text;if(j.detected)m.firstChild.textContent='xlate · detected: '+j.detected}
 }catch(e){m.className='m e';d.textContent='could not reach the server'}
 busy=false;go.disabled=false;inp.focus();out.scrollTop=out.scrollHeight}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();run()});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}});
msg('s','xlate','Pick your languages above, then type or paste text. Enter sends, Shift+Enter adds a new line.');
/* pixel mosaic background */
(function(){var c=document.getElementById('mos'),x=c.getContext('2d'),P=['#f7d6e0','#d6eaf8','#d5f0dd','#fdebc8','#e5dcf5','#fff3b0','#cfe8ef','#fbf7ee','#fbf7ee'];
function draw(){c.width=innerWidth;c.height=innerHeight;var s=26,seed=7;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(var y=0;y*s<c.height;y++)for(var i=0;i*s<c.width;i++){x.fillStyle=P[Math.floor(r()*P.length)];x.fillRect(i*s,y*s,s,s)}}
draw();addEventListener('resize',draw)})();
</script>
</body>
</html>
